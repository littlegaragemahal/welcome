name: Publish welcome screen

# Publishes the site and refreshes the stay dates from the Airbnb calendar.
# The dates go straight to the live site and are never committed, so the
# repository keeps no record of past bookings.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write              # lets the job keep its own schedule switched on

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        env:
          AIRBNB_ICAL: ${{ secrets.AIRBNB_ICAL }}
          LIVE_STAY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/stay.json
        run: |
          mkdir _site
          cp index.html qrcode.js _site/
          python scripts/update_stay.py _site/stay.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled jobs in repos with no commits for 60 days.
      # Re-enabling the workflow each run keeps the calendar refresh alive.
      - name: Keep schedule active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable" || true
